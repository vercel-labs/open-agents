packages:
  - "apps/*"
  - "packages/*"

catalog:
  ai: 7.0.59
  "@ai-sdk/anthropic": 4.0.37
  "@ai-sdk/openai": 4.0.37
  "@ai-sdk/react": 4.0.62
  zod: ^4.3.6

overrides:
  kysely: 0.28.17
  zod: ^4.3.6

minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

allowBuilds:
  "@google/genai": false
  "@nestjs/core": false
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  koffi: false
  protobufjs: false
  sharp: true

# The AI SDK 7 / harness 1.0 stable releases shipped 2026-08-10; exclusions
# below allow them through the 24h minimumReleaseAge window. Remove entries
# once the versions are older than a day.
minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.37"
  - "@ai-sdk/elevenlabs@3.0.27"
  - "@ai-sdk/gateway@4.0.47"
  - "@ai-sdk/harness@1.0.65"
  - "@ai-sdk/harness-claude-code@1.0.67"
  - "@ai-sdk/harness-codex@1.0.67"
  - "@ai-sdk/harness-pi@1.0.66"
  - "@ai-sdk/mcp@2.0.30"
  - "@ai-sdk/provider@4.0.7"
  - "@ai-sdk/provider-utils@5.0.26"
  - "@ai-sdk/openai@4.0.37"
  - "@ai-sdk/react@4.0.62"
  - "@ai-sdk/sandbox-vercel@1.0.65"
  - "ai@7.0.59"
